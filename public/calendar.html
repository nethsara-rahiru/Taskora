<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — Taskora</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    /* ── Heat-Map Density Full Cell Color Fills ── */
    .calendar-day {
      min-height: 84px;
      padding: 0.6rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
      user-select: none;
      position: relative;
    }
    .calendar-day:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .calendar-day.today {
      box-shadow: 0 0 0 2px var(--primary);
    }

    /* Free Day (0 items) */
    .calendar-day.day-free {
      background: var(--bg-surface);
      border-color: var(--border-color);
    }
    /* Normal Day (1-2 items) - Soft Green Fill */
    .calendar-day.day-normal {
      background: color-mix(in srgb, #10B981 16%, var(--bg-surface));
      border-color: color-mix(in srgb, #10B981 40%, transparent);
    }
    /* Busy Day (3-4 items) - Amber Orange Fill */
    .calendar-day.day-busy {
      background: color-mix(in srgb, #F59E0B 20%, var(--bg-surface));
      border-color: color-mix(in srgb, #F59E0B 45%, transparent);
    }
    /* Full Packed Day (5+ items) - Intense Red Fill */
    .calendar-day.day-packed {
      background: color-mix(in srgb, #EF4444 24%, var(--bg-surface));
      border-color: color-mix(in srgb, #EF4444 50%, transparent);
    }

    .day-badge {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 0.15rem 0.45rem;
      border-radius: var(--radius-full);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .day-badge.badge-normal { background: #10B981; }
    .day-badge.badge-busy { background: #F59E0B; }
    .day-badge.badge-packed { background: #EF4444; }

    /* ── Mobile Bottom Sheet Card Popup ── */
    @media (max-width: 768px) {
      .modal-content.mobile-bottom-sheet {
        position: fixed !important;
        bottom: 0 !important;
        top: auto !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
        border-radius: 20px 20px 0 0 !important;
        animation: slideUpSheet 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
        margin: 0 !important;
        max-height: 80vh !important;
        overflow-y: auto !important;
      }
      @keyframes slideUpSheet {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="sidebar"></div>

    <div class="main-content">
      <header class="top-header">
        <div class="header-title-group">
          <h2 style="font-size: 1.25rem; font-weight: 800;">Calendar View</h2>
          <span class="header-date-badge" id="headerDateBadge">Calendar</span>
        </div>

        <div class="user-profile-menu">
          <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <button class="btn btn-primary btn-sm" id="quickAddTaskBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            New Task
          </button>
          <div class="user-avatar" id="headerUserAvatar">U</div>
        </div>
      </header>

      <main class="page-container">
        <div class="dashboard-card">
          <!-- Calendar Title & Month Navigation -->
          <div class="section-title" style="margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <button class="btn btn-secondary btn-sm" id="prevMonthBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
                Prev
              </button>
              <span id="calendarMonthTitle" style="font-size: 1.35rem; font-weight: 800;">Month Year</span>
              <button class="btn btn-secondary btn-sm" id="nextMonthBtn">
                Next
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </button>
            </div>

            <!-- Busyness Legend Bar -->
            <div style="display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; font-size: 0.75rem; font-weight: 700;">
              <span style="display: flex; align-items: center; gap: 0.25rem;">
                <span style="width: 10px; height: 10px; border-radius: 50%; background: var(--bg-surface); border: 1px solid var(--border-color);"></span>
                Free (0)
              </span>
              <span style="display: flex; align-items: center; gap: 0.25rem; color: #10B981;">
                <span style="width: 10px; height: 10px; border-radius: 50%; background: #10B981;"></span>
                Normal (1–2)
              </span>
              <span style="display: flex; align-items: center; gap: 0.25rem; color: #F59E0B;">
                <span style="width: 10px; height: 10px; border-radius: 50%; background: #F59E0B;"></span>
                Busy (3–4)
              </span>
              <span style="display: flex; align-items: center; gap: 0.25rem; color: #EF4444;">
                <span style="width: 10px; height: 10px; border-radius: 50%; background: #EF4444;"></span>
                Packed (5+)
              </span>
            </div>
          </div>

          <div class="calendar-grid" id="calendarGridHeader">
            <div class="calendar-header-day">Sun</div>
            <div class="calendar-header-day">Mon</div>
            <div class="calendar-header-day">Tue</div>
            <div class="calendar-header-day">Wed</div>
            <div class="calendar-header-day">Thu</div>
            <div class="calendar-header-day">Fri</div>
            <div class="calendar-header-day">Sat</div>
          </div>

          <div class="calendar-grid" id="calendarDaysGrid">
            <!-- Days rendered dynamically -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/storage.js"></script>
  <script src="/js/sync.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components/notification.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/task-card.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/router.js"></script>
</body>
</html>
