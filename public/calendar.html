<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar — Taskora</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-container">
    <div class="sidebar"></div>

    <div class="main-content">
      <header class="top-header">
        <h2 style="font-size: 1.2rem; font-weight: 700;">Calendar</h2>
        <div class="user-profile-menu">
          <button class="btn btn-primary btn-sm" id="quickAddTaskBtn">＋ New Task</button>
          <span style="font-size: 0.9rem; font-weight: 600;" id="headerUserName">User</span>
        </div>
      </header>

      <main class="page-container">
        <div class="dashboard-card">
          <div class="section-title">
            <button class="btn btn-secondary btn-sm" id="prevMonthBtn">← Prev</button>
            <span id="calendarMonthTitle" style="font-size: 1.25rem; font-weight: 800;">Month Year</span>
            <button class="btn btn-secondary btn-sm" id="nextMonthBtn">Next →</button>
          </div>

          <div class="calendar-grid" id="calendarGridHeader">
            <div class="calendar-header-day">Sun</div>
            <div class="calendar-header-day">Mon</div>
            <div class="calendar-header-day">Tue</div>
            <div class="calendar-header-day">Wed</div>
            <div class="calendar-header-day">Thu</div>
            <div class="calendar-header-day">Fri</div>
            <div class="calendar-header-day">Sat</div>
          </div>

          <div class="calendar-grid" id="calendarDaysGrid" style="min-height: 400px;">
            <!-- Days rendered here -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components/notification.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/task-card.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/calendar.js"></script>
</body>
</html>
