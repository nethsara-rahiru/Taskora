<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Taskora</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-container">
    <div class="sidebar"></div>

    <div class="main-content">
      <header class="top-header">
        <div class="header-title-group">
          <h2 style="font-size: 1.25rem; font-weight: 800;">Preferences & Settings</h2>
          <span class="header-date-badge" id="headerDateBadge">Settings</span>
        </div>

        <div class="user-profile-menu">
          <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <div class="user-avatar" id="headerUserAvatar">U</div>
        </div>
      </header>

      <main class="page-container" style="max-width: 780px;">
        <!-- Profile Settings -->
        <div class="modal-container" style="max-width: 100%; margin-bottom: 1.75rem; transform: none;">
          <div style="display:flex; align-items:center; gap:0.65rem; margin-bottom: 1.25rem;">
            <div style="width:36px; height:36px; border-radius:var(--radius-sm); background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <h3 style="font-size: 1.15rem; font-weight: 800;">Account Profile</h3>
          </div>

          <form id="profileForm">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="settingsName" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" id="settingsEmail" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-sm">Update Profile</button>
          </form>
        </div>

        <!-- WhatsApp Configuration -->
        <div class="modal-container" style="max-width: 100%; margin-bottom: 1.75rem; transform: none;">
          <div style="display:flex; align-items:center; gap:0.65rem; margin-bottom: 0.5rem;">
            <div style="width:36px; height:36px; border-radius:var(--radius-sm); background:var(--color-success-bg); color:var(--color-success); display:flex; align-items:center; justify-content:center;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
            </div>
            <h3 style="font-size: 1.15rem; font-weight: 800;">WhatsApp Notification Channel</h3>
          </div>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem;">
            Receive task reminders directly on WhatsApp powered by FrontDesk Agents API integration.
          </p>

          <form id="whatsappForm">
            <div class="form-group">
              <label class="form-label">WhatsApp Phone Number (with Country Code)</label>
              <input type="text" id="settingsPhone" class="form-control" placeholder="+1234567890">
            </div>
            <div class="form-group" style="flex-direction: row; align-items: center; gap: 0.65rem;">
              <input type="checkbox" id="settingsWaEnabled" style="width: 18px; height: 18px; accent-color: var(--primary);">
              <label for="settingsWaEnabled" class="form-label" style="margin-bottom:0; cursor:pointer;">Enable WhatsApp Reminders</label>
            </div>
            <div class="settings-actions" style="display: flex; gap: 0.75rem; margin-top: 1.25rem;">
              <button type="submit" class="btn btn-primary btn-sm">Save Preferences</button>
              <button type="button" class="btn btn-secondary btn-sm" id="testWaBtn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Trigger Test Notification
              </button>
            </div>
          </form>
        </div>

        <!-- Security -->
        <div class="modal-container" style="max-width: 100%; transform: none;">
          <div style="display:flex; align-items:center; gap:0.65rem; margin-bottom: 1.25rem;">
            <div style="width:36px; height:36px; border-radius:var(--radius-sm); background:var(--color-warning-bg); color:var(--priority-high); display:flex; align-items:center; justify-content:center;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h3 style="font-size: 1.15rem; font-weight: 800;">Password & Security</h3>
          </div>

          <form id="passwordForm">
            <div class="form-group">
              <label class="form-label">Current Password</label>
              <input type="password" id="currentPass" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">New Password</label>
              <input type="password" id="newPass" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-secondary btn-sm">Update Password</button>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/storage.js"></script>
  <script src="/js/sync.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components/notification.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
