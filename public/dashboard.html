<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Taskora</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-container">
    <div class="sidebar"></div>

    <div class="main-content">
      <header class="top-header">
        <h2 style="font-size: 1.2rem; font-weight: 700;">Dashboard</h2>
        <div class="user-profile-menu">
          <button class="btn btn-primary btn-sm" id="quickAddTaskBtn">＋ New Task</button>
          <span style="font-size: 0.9rem; font-weight: 600;" id="headerUserName">User</span>
        </div>
      </header>

      <main class="page-container">
        <div style="margin-bottom: 1.75rem;">
          <h1 style="font-size: 1.75rem; font-weight: 800;" id="welcomeHeading">Good day!</h1>
          <p style="color: var(--text-muted); font-size: 0.95rem;">Here is your productivity summary for today.</p>
        </div>

        <div class="dashboard-grid">
          <div class="stat-card">
            <div class="stat-icon primary">📅</div>
            <div class="stat-info">
              <div class="stat-value" id="statToday">0</div>
              <div class="stat-label">Due Today</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon success">✓</div>
            <div class="stat-info">
              <div class="stat-value" id="statCompleted">0</div>
              <div class="stat-label">Completed Today</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon danger">⚠️</div>
            <div class="stat-info">
              <div class="stat-value" id="statOverdue">0</div>
              <div class="stat-label">Overdue Tasks</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon warning">🚀</div>
            <div class="stat-info">
              <div class="stat-value" id="statUpcoming">0</div>
              <div class="stat-label">Upcoming</div>
            </div>
          </div>
        </div>

        <div class="dashboard-sections">
          <div class="dashboard-card">
            <div class="section-title">
              <span>Today's Tasks</span>
              <a href="/tasks.html" style="font-size: 0.85rem; font-weight: 600;">View All Tasks →</a>
            </div>
            <div id="todayTaskList">
              <div style="color: var(--text-muted); font-size: 0.9rem; padding: 1rem 0;">Loading tasks...</div>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 1.25rem;">
            <div class="dashboard-card">
              <div class="section-title">Completion Rate</div>
              <div style="font-size: 2rem; font-weight: 800; color: var(--primary);" id="statRate">0%</div>
              <div style="width: 100%; height: 8px; background: var(--bg-input); border-radius: 4px; overflow: hidden; margin-top: 0.5rem;">
                <div id="rateProgressBar" style="width: 0%; height: 100%; background: var(--primary); transition: var(--transition);"></div>
              </div>
            </div>

            <div class="dashboard-card">
              <div class="section-title">Recently Completed</div>
              <div id="recentList">
                <div style="color: var(--text-muted); font-size: 0.85rem;">No recent completions.</div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components/notification.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/task-card.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadCurrentPageData() {
      try {
        const data = await API.get('/dashboard');
        const s = data.summary;

        document.getElementById('statToday').textContent = s.todayTasks;
        document.getElementById('statCompleted').textContent = s.completedToday;
        document.getElementById('statOverdue').textContent = s.overdue;
        document.getElementById('statUpcoming').textContent = s.upcoming;
        document.getElementById('statRate').textContent = `${s.completionRate}%`;
        document.getElementById('rateProgressBar').style.width = `${s.completionRate}%`;

        // Today tasks list
        const todayContainer = document.getElementById('todayTaskList');
        todayContainer.innerHTML = '';
        if (data.todayTasks.length === 0) {
          todayContainer.innerHTML = `<div style="color: var(--text-muted); font-size: 0.9rem; padding: 1rem 0;">🎉 All caught up for today!</div>`;
        } else {
          data.todayTasks.forEach(task => {
            const card = TaskCard.render(
              task,
              async (id, completed) => {
                const endpoint = completed ? `/tasks/${id}/complete` : `/tasks/${id}/uncomplete`;
                await API.post(endpoint);
                loadCurrentPageData();
              },
              (taskToEdit) => App.openTaskModal(taskToEdit),
              async (id) => {
                if (confirm('Delete this task?')) {
                  await API.delete(`/tasks/${id}`);
                  loadCurrentPageData();
                }
              }
            );
            todayContainer.appendChild(card);
          });
        }

        // Recent list
        const recentContainer = document.getElementById('recentList');
        recentContainer.innerHTML = '';
        if (data.recentlyCompleted.length === 0) {
          recentContainer.innerHTML = `<div style="color: var(--text-muted); font-size: 0.85rem;">No recent completions.</div>`;
        } else {
          data.recentlyCompleted.forEach(t => {
            const div = document.createElement('div');
            div.style.cssText = 'padding: 0.5rem 0; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; display: flex; justify-content: space-between;';
            div.innerHTML = `<span>✓ ${TaskCard.escapeHtml(t.title)}</span> <span style="color: var(--text-light);">${new Date(t.completedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;
            recentContainer.appendChild(div);
          });
        }
      } catch (err) {
        Notifications.show('Failed to load dashboard data', 'error');
      }
    }

    window.loadCurrentPageData = loadCurrentPageData;
  </script>
</body>
</html>
