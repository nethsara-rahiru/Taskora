<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timetables — Taskora</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .timetable-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      max-width: 100%;
      width: 100%;
      padding: 0.5rem 0;
      margin-bottom: 1.25rem;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }
    .timetable-pill {
      padding: 0.45rem 1rem;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: var(--radius-full);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition-fast);
    }
    .timetable-pill.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
      box-shadow: var(--shadow-xs);
    }

    /* ── Continuous Time-Grid Matrix Layout (Zero Day Gap) ── */
    .weekly-grid-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      background: var(--bg-surface);
      box-shadow: var(--shadow-sm);
    }

    .matrix-table {
      display: grid;
      grid-template-columns: 64px repeat(7, minmax(130px, 1fr));
      gap: 0;
      width: max(100%, calc(64px + 7 * 130px));
      box-sizing: border-box;
      user-select: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .matrix-table.tab-fade-in {
      animation: matrixTabFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes matrixTabFadeIn {
      from {
        opacity: 0.3;
        transform: translateY(4px) scale(0.995);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .matrix-table.single-day {
      grid-template-columns: 64px 1fr;
      width: 100%;
    }

    /* ── Sticky Matrix Header Row ── */
    .matrix-header-cell {
      padding: 0.75rem 0.5rem;
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-main);
      background: var(--bg-surface);
      border-bottom: 2px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .matrix-header-cell:last-child {
      border-right: none;
    }
    .matrix-header-cell.is-today {
      background: var(--primary-light);
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .time-header-corner {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── Body: Timeline Y-Axis & Day Grid Columns ── */
    .time-axis-col {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      background: var(--bg-surface);
    }
    .time-slot-label {
      height: 54px;
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px dashed var(--border-color);
      box-sizing: border-box;
    }

    .matrix-day-col {
      position: relative;
      border-right: 1px solid var(--border-color);
      background: var(--bg-surface);
      height: calc(17 * 54px); /* 17 hours from 06:00 to 22:00 */
      box-sizing: border-box;
    }
    .matrix-day-col:last-child {
      border-right: none;
    }
    .matrix-day-col.is-today {
      background: color-mix(in srgb, var(--primary) 3%, var(--bg-surface));
    }

    /* Hour grid horizontal lines */
    .hour-grid-line {
      height: 54px;
      border-bottom: 1px dashed var(--border-color);
      box-sizing: border-box;
    }

    /* ── Solid Colored Slot Block Overlay ── */
    .matrix-slot-block {
      position: absolute;
      left: 2px;
      right: 2px;
      border-radius: var(--radius-md);
      padding: 0.45rem 0.6rem;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
      overflow: hidden;
      box-sizing: border-box;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }
    .matrix-slot-block:hover {
      transform: scale(1.02);
      z-index: 20;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
    }

    .slot-block-title {
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    .slot-block-time {
      font-size: 0.68rem;
      font-weight: 700;
      opacity: 0.92;
      display: flex;
      align-items: center;
      gap: 0.2rem;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    .slot-block-meta {
      font-size: 0.68rem;
      opacity: 0.88;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    .slot-block-actions {
      position: absolute;
      top: 0.25rem;
      right: 0.25rem;
      display: flex;
      gap: 0.2rem;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .matrix-slot-block:hover .slot-block-actions {
      opacity: 1;
    }
    .slot-block-btn {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.35);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .slot-block-btn:hover {
      background: rgba(0, 0, 0, 0.65);
    }
    /* ── Schedule Switcher Panel ── */
    .switcher-panel {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding: 0.75rem 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xs);
      flex-wrap: wrap;
    }
    .switcher-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .switcher-scrollable {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding: 0.15rem 0;
    }
    .switcher-scrollable::-webkit-scrollbar { display: none; }
    .schedule-tab {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--border-color);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .schedule-tab:hover {
      background: var(--bg-hover, rgba(0,0,0,0.04));
      border-color: var(--primary);
      color: var(--text-main);
    }
    .schedule-tab.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 800;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 12%, transparent);
    }
    .schedule-tab .tab-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .schedule-tab .tab-primary-badge {
      font-size: 0.6rem;
      background: var(--primary);
      color: white;
      padding: 0.05rem 0.3rem;
      border-radius: 3px;
      font-weight: 800;
      letter-spacing: 0.03em;
    }
    .switcher-divider {
      width: 1px;
      height: 28px;
      background: var(--border-color);
      flex-shrink: 0;
    }
    .switcher-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="sidebar"></div>

    <div class="main-content" style="overflow-x: hidden;">
      <header class="top-header">
        <div class="header-title-group">
          <h2 style="font-size: 1.25rem; font-weight: 800;">Timetables & Schedules</h2>
          <span class="header-date-badge" id="headerDateBadge">Weekly Schedules</span>
        </div>

        <div class="user-profile-menu">
          <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle Theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <button class="btn btn-primary btn-sm" id="createTimetableBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            New Schedule
          </button>
          <div class="user-avatar" id="headerUserAvatar">U</div>
        </div>
      </header>

      <main class="page-container" style="overflow-x: hidden;">

        <!-- Schedule Switcher Panel -->
        <div class="switcher-panel" id="switcherPanel">
          <span class="switcher-label">Schedules</span>
          <div class="switcher-scrollable" id="timetablePillsContainer">
            <span style="color: var(--text-muted); font-size: 0.875rem;">Loading...</span>
          </div>
          <div class="switcher-divider" id="switcherDivider"></div>
          <div class="switcher-actions">
            <button class="btn btn-secondary btn-sm" id="addSlotBtn" style="display: none;" title="Add Slot">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Add Slot
            </button>
            <button class="btn btn-ghost btn-sm" id="editTimetableMetaBtn" style="display: none;" title="Edit Schedule">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="btn btn-ghost btn-sm" id="deleteTimetableBtn" style="display: none;" title="Delete Schedule">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </div>

        <!-- Day Filter Tabs -->
        <div class="view-tabs" id="dayFilterTabsContainer" style="margin-bottom: 1.25rem;">
          <button class="tab-btn active" data-day="all">All Days</button>
          <button class="tab-btn" data-day="1">Mon</button>
          <button class="tab-btn" data-day="2">Tue</button>
          <button class="tab-btn" data-day="3">Wed</button>
          <button class="tab-btn" data-day="4">Thu</button>
          <button class="tab-btn" data-day="5">Fri</button>
          <button class="tab-btn" data-day="6">Sat</button>
          <button class="tab-btn" data-day="0">Sun</button>
        </div>

        <!-- Weekly Mon-Sun Matrix Grid Container -->
        <div class="weekly-grid-wrapper">
          <div class="matrix-table" id="weeklyGridContainer">
            <div style="color: var(--text-muted); grid-column: 1/-1; padding: 3rem 0; text-align: center;">Loading weekly schedule...</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/storage.js"></script>
  <script src="/js/sync.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components/notification.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/task-card.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/timetables.js"></script>
</body>
</html>
