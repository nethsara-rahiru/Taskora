<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Taskora</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .project-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;

    }
    .project-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .project-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .project-title {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="sidebar"></div>

    <div class="main-content">
      <header class="top-header">
        <h2 style="font-size: 1.2rem; font-weight: 700;">Projects</h2>
        <div class="user-profile-menu">
          <button class="btn btn-primary btn-sm" id="createProjectBtn">＋ New Project</button>
          <span style="font-size: 0.9rem; font-weight: 600;" id="headerUserName">User</span>
        </div>
      </header>

      <main class="page-container">
        <div class="projects-grid" id="projectsContainer">
          <div style="color: var(--text-muted);">Loading projects...</div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/components/notification.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/task-card.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/projects.js"></script>
</body>
</html>
